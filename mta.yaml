_schema-version: '3.1'
ID: rental-equipment-tracking
version: 1.0.0
description: Rental Equipment Tracking CAP application
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/copy-app.js
modules:
  - name: rental-equipment-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: rental-db
      - name: rental-uaa
      - name: rental-destination
    build-parameters:
      builder: npm-ci
resources:
  - name: rental-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}
  - name: rental-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: rental-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
